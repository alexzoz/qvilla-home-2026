    <rect x="1245" y="96" width="418" height="748" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="1245" y="96" width="418" height="36" rx="8" class="tbl-hdr"/>
<text x="1454" y="119" class="tbl-hdr-txt" text-anchor="middle">THÔNG SỐ GỐC XHOME — TẦNG TUM (KT-4.04 &amp; CĐ-14)</text>
<rect x="1253" y="142" width="402" height="78" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="1259" y="150" width="98" height="24" rx="4" fill="#0c4a6e"/>
<text x="1308" y="166" style="font-size:9.1px;font-weight:800;fill:#e0f2fe;text-anchor:middle;">HÀNH LANG TUM</text>
<text x="1364" y="166" class="tbl-bold">Trần Giật Cấp Khe LED Dây + 05 Spotlight</text>
<text x="1263" y="188" class="tbl-cell-txt">• CĐ-14 gốc vẽ ô giật cấp chữ nhật hắt LED 4 cạnh (Lộ 4,5,6)</text>
<text x="1263" y="206" class="tbl-cell-txt" style="fill:#0369a1;">• 04 đèn Spotlight 9W dọc hành lang (Lộ HL) + 01 đèn cửa thang (L1)</text>
<rect x="1253" y="226" width="402" height="78" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="1259" y="234" width="98" height="24" rx="4" fill="#0c4a6e"/>
<text x="1308" y="250" style="font-size:9.1px;font-weight:800;fill:#e0f2fe;text-anchor:middle;">PHÒNG KHO GỐC</text>
<text x="1364" y="250" class="tbl-bold">Trần Phẳng Trong Nhà + 03 Spotlight (Lộ 3)</text>
<text x="1263" y="272" class="tbl-cell-txt">• Bố trí 03 đèn Spotlight 9W 4000K tại 3 góc Phòng Kho (Trục 2–3)</text>
<text x="1263" y="290" class="tbl-cell-txt" style="fill:#0369a1;">• Cạnh góc Đông Nam là 01 Ô Giếng Trời đơn nhỏ theo bản gốc</text>
<rect x="1253" y="310" width="402" height="78" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="1259" y="318" width="98" height="24" rx="4" fill="#0c4a6e"/>
<text x="1308" y="334" style="font-size:9.1px;font-weight:800;fill:#e0f2fe;text-anchor:middle;">CẦU THANG BỘ</text>
<text x="1364" y="334" class="tbl-bold">Mái Bê Tông Cầu Thang (Chưa Mở Mái Kính Thang)</text>
<text x="1263" y="356" class="tbl-cell-txt">• Tủ điện TĐ4 (+1.5m) + Chờ nguồn cảm biến hiện diện bật tắt đèn thang</text>
<text x="1263" y="374" class="tbl-cell-txt" style="fill:#0369a1;">• Đèn gắn tường cầu thang 24W (Lộ T3)</text>
<rect x="1253" y="394" width="402" height="78" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="1259" y="402" width="98" height="24" rx="4" fill="#0c4a6e"/>
<text x="1308" y="418" style="font-size:9.1px;font-weight:800;fill:#e0f2fe;text-anchor:middle;">SÂN TRƯỚC</text>
<text x="1364" y="418" class="tbl-bold">Sân Thượng Phía Tây (Trục 1'–2)</text>
<text x="1263" y="440" class="tbl-cell-txt">• 03 Đèn ống bơ nổi 12W 4000K gắn dưới dầm/lam (Lộ 4)</text>
<text x="1263" y="458" class="tbl-cell-txt" style="fill:#0369a1;">• Không đóng trần thạch cao ngoài trời</text>
<rect x="1253" y="478" width="402" height="78" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="1259" y="486" width="98" height="24" rx="4" fill="#0c4a6e"/>
<text x="1308" y="502" style="font-size:9.1px;font-weight:800;fill:#e0f2fe;text-anchor:middle;">SÂN BBQ - GYM</text>
<text x="1364" y="502" class="tbl-bold">Sân Thượng Phía Bắc (Trục 2–4)</text>
<text x="1263" y="524" class="tbl-cell-txt">• 08 Đèn ống bơ nổi 12W 4000K chia 2 hàng (Lộ 5)</text>
<text x="1263" y="542" class="tbl-cell-txt" style="fill:#0369a1;">• Khu vực ngoài trời dưới hệ khung lam trang trí</text>
<rect x="1253" y="562" width="402" height="78" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="1259" y="570" width="98" height="24" rx="4" fill="#0c4a6e"/>
<text x="1308" y="586" style="font-size:9.1px;font-weight:800;fill:#e0f2fe;text-anchor:middle;">SÂN SAU - PHƠI</text>
<text x="1364" y="586" class="tbl-bold">Sân Phơi Phía Đông (Trục 3–4)</text>
<text x="1263" y="608" class="tbl-cell-txt">• 04 Đèn ống bơ nổi 12W 4000K tại 4 góc sân phơi (Lộ 6)</text>
<text x="1263" y="626" class="tbl-cell-txt" style="fill:#0369a1;">• Khu giặt phơi thoáng gió phía sau</text>
<rect x="1253" y="646" width="402" height="78" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="1259" y="654" width="98" height="24" rx="4" fill="#0c4a6e"/>
<text x="1308" y="670" style="font-size:9.1px;font-weight:800;fill:#e0f2fe;text-anchor:middle;">ĐIỂM ĐỐI CHIẾU</text>
<text x="1364" y="670" class="tbl-bold">So Với Phương Án Tầng Tum Đã Nâng Cấp Sau Này</text>
<text x="1263" y="692" class="tbl-cell-txt">• Bản gốc CĐ-14 chỉ có 01 ô Giếng trời nhỏ góc Kho, thang bộ đổ kín</text>
<text x="1263" y="710" class="tbl-cell-txt" style="fill:#0369a1;">• Phương án mới tách 02 Mái kính lớn + Đổ trần BTCT Kho Solar +1.85m</text>
