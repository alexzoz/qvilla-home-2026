      .room-lbl { font-size: 12px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .note-lbl { font-size: 9px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .dim-line { stroke: #dc2626; stroke-width: 1.3; marker-start: url(#dim-tick); marker-end: url(#dim-tick); }
      .dim-txt { font-size: 10.5px; font-weight: 800; fill: #b91c1c; text-anchor: middle; }
      .spot { fill: #ffffff; stroke: #0284c7; stroke-width: 1.8; }
      .spot-cross { stroke: #0284c7; stroke-width: 1.1; }
      .surface-spot { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
      .tbl-hdr { fill: #0f172a; }
      .tbl-hdr-txt { font-size: 11.5px; font-weight: 800; fill: #ffffff; }
      .tbl-cell-txt { font-size: 9.7px; font-weight: 600; fill: #1e293b; }
      .tbl-bold { font-size: 10.5px; font-weight: 800; fill: #0f172a; }
    </style>
