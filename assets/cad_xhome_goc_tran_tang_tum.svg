    <text x="168" y="34" class="title-h1">MẶT BẰNG TRẦN &amp; CHIẾU SÁNG TẦNG TUM — 100% THIẾT KẾ NGUYÊN BẢN XHOME</text>
    <text x="168" y="55" class="title-sub">Trích xuất 1:1 từ bản vẽ CĐ-14 gốc XHOME (Hành lang Tum giật cấp khe LED + Phòng Kho 03 đèn + 01 Giếng trời nhỏ góc Đông Nam)</text>
